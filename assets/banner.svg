<svg width="840" height="210" viewBox="0 0 840 210" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- BACKGROUND -->
  <rect width="840" height="210" fill="#f4f4ef"/>
  <line x1="0" y1="0"   x2="840" y2="0"   stroke="#ddd" stroke-width="1.5"/>
  <line x1="0" y1="209" x2="840" y2="209" stroke="#ddd" stroke-width="1.5"/>
  <rect x="0" y="0" width="4" height="210" fill="#222"/>

  <!-- CORNER BRACKETS at all 4 corners -->
  <path d="M 40 16 L 16 16 L 16 40"       stroke="#ccc" stroke-width="1.5" fill="none"/>
  <path d="M 800 16 L 824 16 L 824 40"    stroke="#ccc" stroke-width="1.5" fill="none"/>
  <path d="M 40 194 L 16 194 L 16 170"    stroke="#ccc" stroke-width="1.5" fill="none"/>
  <path d="M 800 194 L 824 194 L 824 170" stroke="#ccc" stroke-width="1.5" fill="none"/>

  <!-- Panel divider between text and diagram -->
  <line x1="447" y1="16" x2="447" y2="194" stroke="#e6e6e2" stroke-width="0.7"/>

  <!-- GAP WATERMARK -->
  <text x="415" y="115" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#dcdcda">&#x222B;dW</text>

  <!-- Faint centerline for stochastic region -->
  <line x1="466" y1="105" x2="785" y2="105" stroke="#eaeae6" stroke-width="0.6" stroke-dasharray="2,5"/>

  <!-- BROWNIAN ENVELOPE ±2σ (expanding) -->
  <polyline stroke="#c8c8c4" stroke-width="0.8" stroke-dasharray="4,4" fill="none"
    points="466,105 505,78 545,65 585,56 638,46 691,37 758,28 785,25"/>
  <polyline stroke="#c8c8c4" stroke-width="0.8" stroke-dasharray="4,4" fill="none"
    points="466,105 505,133 545,146 585,156 638,164 691,174 758,183 785,185"/>

  <!-- Faint secondary sample paths -->
  <polyline stroke="#bbb" stroke-width="0.7" stroke-opacity="0.3" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="466,91 484,86 502,93 521,85 540,91 559,84 577,89 595,83 614,88 639,83 691,75 758,68 785,72"/>
  <polyline stroke="#bbb" stroke-width="0.7" stroke-opacity="0.3" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="466,119 484,125 502,119 521,126 540,120 559,127 577,121 595,127 614,122 639,128 691,137 758,143 785,141"/>

  <!-- MAIN BROWNIAN PATH -->
  <polyline stroke="#444" stroke-width="1.2" stroke-opacity="0.55" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="466,105 480,107 492,104 506,109 519,104 532,109 545,105
            559,111 572,106 585,111 598,106 612,111 625,106
            638,111 651,107 665,112 678,107 691,112
            704,107 718,110 731,107 745,111 757,107 771,111 785,107"/>

  <!-- Starting dot -->
  <circle cx="466" cy="105" r="3.2" fill="#aaa" fill-opacity="0.7"/>
  <circle cx="466" cy="105" r="1.4" fill="#555"/>

  <!-- t=T vertical separator -->
  <line x1="785" y1="16" x2="785" y2="194" stroke="#e0e0da" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- t/2 axis tick -->
  <line x1="626" y1="183" x2="626" y2="190" stroke="#ccc" stroke-width="0.8"/>
  <text x="626" y="203" font-family="'Courier New',Courier,monospace" font-size="6.5" fill="#ccc" text-anchor="middle">t/2</text>

  <!-- NORMAL DISTRIBUTION N(0,t) at x=785 -->
  <!-- ±2σ fill -->
  <polygon fill="#e8e8e4" stroke="none"
    points="785,25 789,25 796,46 804,65 812,82 815,91 817,105
            815,119 812,130 804,146 796,164 789,185 785,185"/>
  <!-- ±1σ fill -->
  <polygon fill="#d5d5d1" stroke="none"
    points="785,65 804,65 812,82 815,91 817,105
            815,119 812,130 804,146 785,146"/>
  <!-- Bell curve outline -->
  <polyline stroke="#999" stroke-width="1.6" fill="none" stroke-linecap="round"
    points="789,25 796,46 804,65 812,82 815,91 817,105
            815,119 812,130 804,146 796,164 789,185"/>

  <!-- Axis ticks: ±2σ, ±1σ, μ -->
  <line x1="782" y1="105" x2="788" y2="105" stroke="#999" stroke-width="1.4"/>
  <line x1="782" y1="65"  x2="787" y2="65"  stroke="#bbb" stroke-width="1"/>
  <line x1="782" y1="146" x2="787" y2="146" stroke="#bbb" stroke-width="1"/>
  <line x1="783" y1="25"  x2="786" y2="25"  stroke="#ccc" stroke-width="0.8"/>
  <line x1="783" y1="185" x2="786" y2="185" stroke="#ccc" stroke-width="0.8"/>

  <!-- Distribution labels -->
  <text x="820" y="108" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#999">&#x3BC;</text>
  <text x="820" y="63"  font-family="'Courier New',Courier,monospace" font-size="7"   fill="#bbb">+&#x3C3;</text>
  <text x="820" y="149" font-family="'Courier New',Courier,monospace" font-size="7"   fill="#bbb">&#x2212;&#x3C3;</text>
  <text x="820" y="24"  font-family="'Courier New',Courier,monospace" font-size="6.5" fill="#ccc">+2&#x3C3;</text>
  <text x="820" y="190" font-family="'Courier New',Courier,monospace" font-size="6.5" fill="#ccc">&#x2212;2&#x3C3;</text>
  <text x="803" y="13"  font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#bbb" text-anchor="middle">N(0,t)</text>

  <!-- B(t) and time labels -->
  <text x="464" y="14" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#ccc">B(t)</text>
  <text x="466" y="204" font-family="'Courier New',Courier,monospace" font-size="7" fill="#bbb" text-anchor="middle">t=0</text>
  <text x="785" y="204" font-family="'Courier New',Courier,monospace" font-size="7" fill="#bbb" text-anchor="middle">t=T</text>

  <!-- LEFT TEXT -->
  <text x="28" y="96"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="72" fill="#111" letter-spacing="-1">JER&#xD3;NIMO</text>

  <text x="30" y="128"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="30" fill="#aaa">HOYOS BOTERO</text>

  <line x1="30" y1="143" x2="430" y2="143" stroke="#ddd" stroke-width="1"/>

  <text x="32" y="163"
    font-family="Georgia,'Times New Roman',serif"
    font-style="italic" font-size="16" fill="#666">Data Scientist &#xB7; ML Engineer</text>

  <text x="32" y="183"
    font-family="'Courier New',Courier,monospace"
    font-size="10" fill="#aaa" letter-spacing="2.5">MEDELL&#xCD;N &#xB7; COLOMBIA</text>

</svg>
