  <polyline stroke="#444" stroke-width="1.1" stroke-opacity="0.50" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,95 521,93 532,97 543,93 554,97 565,93 576,97 587,93 598,91
