            708,123 719,128 730,125 741,129 752,126 763,130 774,132"/>

  <!-- H — strong downward drift, ends ≈155, faintest -->
  <polyline stroke="#555" stroke-width="1" stroke-opacity="0.18" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,95 521,103 532,112 543,120 554,116 565,123 576,127 587,124 598,130
            609,134 620,131 631,136 642,133 653,137 664,140 675,137 686,141 697,144
            708,141 719,146 730,143 741,148 752,145 763,150 774,155"/>

  <!-- starting point -->
  <circle cx="510" cy="95" r="3.2" fill="#aaa" fill-opacity="0.7"/>
  <circle cx="510" cy="95" r="1.4" fill="#555"/>

  <!-- t=T separator -->
  <line x1="774" y1="22" x2="774" y2="170" stroke="#e0e0da" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ── VERTICAL N(0,T) DISTRIBUTION at x=774 ──────────────────── -->
  <!-- N(μ=95, σ=35, amplitude=28): x = 774 + 28·exp(-(y-95)²/2450) -->

  <!-- ±2σ fill (full distribution area) -->
  <polygon fill="#eaeae6" stroke="none"
    points="774,25 778,25 782,40 789,55 795,68 800,80 801,88 802,95
            801,102 800,110 795,122 789,135 782,150 778,165 774,165"/>

  <!-- ±1σ fill (darker inner region, 68% area) -->
  <polygon fill="#ddddd9" stroke="none"
    points="774,60 791,60 795,68 800,80 801,88 802,95
            801,102 800,110 795,122 791,130 774,130"/>

  <!-- bell curve outline -->
  <polyline stroke="#aaa" stroke-width="1.4" fill="none" stroke-linecap="round"
    points="778,25 782,40 789,55 795,68 800,80 801,88 802,95
            801,102 800,110 795,122 789,135 782,150 778,165"/>

  <!-- horizontal ticks at μ and ±1σ -->
  <line x1="772" y1="95"  x2="776" y2="95"  stroke="#aaa" stroke-width="1.2"/>
  <line x1="772" y1="60"  x2="775" y2="60"  stroke="#bbb" stroke-width="1"/>
  <line x1="772" y1="130" x2="775" y2="130" stroke="#bbb" stroke-width="1"/>

  <!-- labels: μ, +σ, −σ  — all right of the peak (x≥806) so no overlap -->
  <text x="806" y="98"  font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#999">&#x3BC;</text>
  <text x="806" y="57"  font-family="'Courier New',Courier,monospace" font-size="7"   fill="#bbb">+&#x3C3;</text>
  <text x="806" y="140" font-family="'Courier New',Courier,monospace" font-size="7"   fill="#bbb">&#x2212;&#x3C3;</text>

  <!-- "N(0,t)" label above bell curve, clear of border bracket -->
  <text x="788" y="17" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#bbb" text-anchor="middle">N(0,t)</text>

  <!-- "B(t)" process label, above paths start -->
  <text x="508" y="14" font-family="'Courier New',Courier,monospace" font-size="8" fill="#ccc">B(t)</text>

  <!-- time labels, below envelope, y=183 — well below any path or envelope element -->
  <text x="510" y="184" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#bbb" text-anchor="middle">t=0</text>
  <text x="774" y="184" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#bbb" text-anchor="middle">t=T</text>

  <!-- ── LEFT TEXT ────────────────────────────────────────────────── -->

  <text x="28" y="88"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="72" fill="#111" letter-spacing="-1">JER&#xD3;NIMO</text>

  <text x="30" y="130"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="46" fill="#aaa">HOYOS BOTERO</text>

  <line x1="30" y1="144" x2="432" y2="144" stroke="#ddd" stroke-width="1"/>

  <text x="32" y="165"
    font-family="Georgia,'Times New Roman',serif"
    font-style="italic" font-size="17" fill="#666">Data Scientist &#xB7; ML Engineer</text>

  <text x="32" y="188"
    font-family="'Courier New',Courier,monospace"
    font-size="9.5" fill="#aaa" letter-spacing="2.5">MEDELL&#xCD;N &#xB7; COLOMBIA</text>

</svg>
