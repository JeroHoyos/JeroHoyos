<svg width="860" height="200" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- ── BACKGROUND ──────────────────────────────────────────────── -->
  <rect width="860" height="200" fill="#f4f4ef"/>
  <line x1="0" y1="0"   x2="860" y2="0"   stroke="#ddd" stroke-width="2"/>
  <line x1="0" y1="199" x2="860" y2="199" stroke="#ddd" stroke-width="2"/>
  <rect x="0" y="0" width="4" height="200" fill="#222"/>
  <path d="M 820 14 L 844 14 L 844 38" stroke="#ccc" stroke-width="1.5" fill="none"/>

  <!-- ── GAP WATERMARKS (x≈437–470, faint) ──────────────────────── -->
  <text x="437" y="50"  font-family="'Courier New',Courier,monospace" font-size="9.5" fill="#dcdcda">E[B(t)]=0</text>
  <text x="437" y="100" font-family="'Courier New',Courier,monospace" font-size="9.5" fill="#dcdcda">Var(B)=t</text>
  <text x="440" y="153" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#dcdcda">&#x222B;dW</text>

  <!-- ── STOCHASTIC PROCESS B(t) (x: 510 → 774) ─────────────────── -->

  <!-- ±2σ ENVELOPE: y = 95 ± 70·√((x-510)/264), very faint dashed -->
  <polyline stroke="#c8c8c4" stroke-width="0.8" stroke-dasharray="4,4" fill="none"
    points="510,95 532,75 554,66 576,60 609,52 642,46 686,38 730,31 774,25"/>
  <polyline stroke="#c8c8c4" stroke-width="0.8" stroke-dasharray="4,4" fill="none"
    points="510,95 532,115 554,124 576,130 609,138 642,145 686,152 730,159 774,165"/>

  <!-- ±1σ ENVELOPE: y = 95 ± 35·√((x-510)/264), slightly darker dashed -->
  <polyline stroke="#d8d8d4" stroke-width="0.8" stroke-dasharray="2,5" fill="none"
    points="510,95 554,81 609,74 642,70 686,66 730,63 774,60"/>
  <polyline stroke="#d8d8d4" stroke-width="0.8" stroke-dasharray="2,5" fill="none"
    points="510,95 554,109 609,116 642,120 686,124 730,127 774,130"/>

  <!-- ── 8 BROWNIAN PATHS (25 pts each, step≈11px) ─────────────── -->

  <!-- A — strong upward drift, ends ≈42, faintest -->
  <polyline stroke="#555" stroke-width="1" stroke-opacity="0.18" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,95 521,90 532,85 543,81 554,77 565,73 576,68 587,71 598,66
            609,63 620,66 631,63 642,59 653,56 664,58 675,54 686,51 697,54
            708,50 719,53 730,49 741,45 752,42 763,39 774,42"/>

  <!-- B — gradual upward, ends ≈66 -->
  <polyline stroke="#555" stroke-width="1" stroke-opacity="0.30" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,95 521,91 532,87 543,84 554,80 565,85 576,82 587,79 598,75
            609,79 620,76 631,73 642,77 653,73 664,71 675,74 686,70 697,73
            708,69 719,71 730,68 741,71 752,67 763,69 774,66"/>

  <!-- C — slight upward with noise, ends ≈82 -->
  <polyline stroke="#555" stroke-width="1" stroke-opacity="0.40" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,95 521,93 532,90 543,94 554,90 565,86 576,90 587,86 598,84
            609,88 620,84 631,87 642,83 653,86 664,83 675,87 686,83 697,87
            708,83 719,86 730,82 741,84 752,80 763,83 774,82"/>

