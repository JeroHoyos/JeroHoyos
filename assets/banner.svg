<svg width="920" height="170" viewBox="0 0 920 170" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- BACKGROUND -->
  <rect width="920" height="170" fill="#f4f4ef"/>
  <line x1="0" y1="0"   x2="920" y2="0"   stroke="#ddd" stroke-width="1.5"/>
  <line x1="0" y1="169" x2="920" y2="169" stroke="#ddd" stroke-width="1.5"/>
  <rect x="0" y="0" width="4" height="170" fill="#222"/>

  <!-- CORNER BRACKETS at all 4 corners -->
  <path d="M 40 16 L 16 16 L 16 40"       stroke="#ccc" stroke-width="1.5" fill="none"/>
  <path d="M 880 16 L 904 16 L 904 40"    stroke="#ccc" stroke-width="1.5" fill="none"/>
  <path d="M 40 156 L 16 156 L 16 132"    stroke="#ccc" stroke-width="1.5" fill="none"/>
  <path d="M 880 156 L 904 156 L 904 132" stroke="#ccc" stroke-width="1.5" fill="none"/>

  <!-- Panel divider between text and diagram -->
  <line x1="490" y1="16" x2="490" y2="156" stroke="#e6e6e2" stroke-width="0.7"/>

  <!-- GAP WATERMARK -->
  <text x="413" y="93" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#dcdcda">&#x222B;dW</text>

  <!-- Faint centerline for stochastic region -->
  <line x1="510" y1="85" x2="860" y2="85" stroke="#eaeae6" stroke-width="0.6" stroke-dasharray="2,5"/>

  <!-- BROWNIAN ENVELOPE ±2σ (expanding) -->
  <polyline stroke="#c8c8c4" stroke-width="0.8" stroke-dasharray="4,4" fill="none"
    points="510,85 553,63 597,53 641,45 699,37 757,30 830,23 860,20"/>
  <polyline stroke="#c8c8c4" stroke-width="0.8" stroke-dasharray="4,4" fill="none"
    points="510,85 553,108 597,118 641,126 699,133 757,141 830,148 860,150"/>

  <!-- Faint secondary sample paths -->
  <polyline stroke="#bbb" stroke-width="0.7" stroke-opacity="0.3" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,74 530,70 550,75 570,69 592,74 612,68 632,72 652,67 672,71 700,67 757,61 830,55 860,58"/>
  <polyline stroke="#bbb" stroke-width="0.7" stroke-opacity="0.3" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,96 530,101 550,96 570,102 592,97 612,103 632,98 652,103 672,99 700,104 757,111 830,116 860,114"/>

  <!-- MAIN BROWNIAN PATH -->
  <polyline stroke="#444" stroke-width="1.2" stroke-opacity="0.55" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,85 525,87 539,84 554,88 568,84 583,88 597,85
            612,90 626,86 641,90 655,86 670,90 684,86
            699,90 713,87 728,91 742,87 757,91
            771,87 786,89 800,87 815,90 829,87 844,90 860,87"/>

  <!-- Starting dot -->
  <circle cx="510" cy="85" r="3" fill="#aaa" fill-opacity="0.7"/>
  <circle cx="510" cy="85" r="1.4" fill="#555"/>

  <!-- t=T vertical separator -->
  <line x1="860" y1="16" x2="860" y2="154" stroke="#e0e0da" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- t/2 axis tick -->
  <line x1="685" y1="150" x2="685" y2="156" stroke="#ccc" stroke-width="0.8"/>
  <text x="685" y="165" font-family="'Courier New',Courier,monospace" font-size="6.5" fill="#ccc" text-anchor="middle">t/2</text>

  <!-- NORMAL DISTRIBUTION N(0,t) at x=860 -->
  <!-- ±2σ fill -->
  <polygon fill="#e8e8e4" stroke="none"
    points="860,20 864,20 872,37 881,53 889,66 893,74 895,85
            893,96 889,105 881,118 872,133 864,150 860,150"/>
  <!-- ±1σ fill -->
  <polygon fill="#d5d5d1" stroke="none"
    points="860,53 881,53 889,66 893,74 895,85
            893,96 889,105 881,118 860,118"/>
  <!-- Bell curve outline -->
  <polyline stroke="#999" stroke-width="1.6" fill="none" stroke-linecap="round"
    points="864,20 872,37 881,53 889,66 893,74 895,85
            893,96 889,105 881,118 872,133 864,150"/>

  <!-- Axis ticks: ±2σ, ±1σ, μ -->
  <line x1="857" y1="85"  x2="863" y2="85"  stroke="#999" stroke-width="1.4"/>
  <line x1="857" y1="53"  x2="862" y2="53"  stroke="#bbb" stroke-width="1"/>
  <line x1="857" y1="118" x2="862" y2="118" stroke="#bbb" stroke-width="1"/>
  <line x1="858" y1="20"  x2="861" y2="20"  stroke="#ccc" stroke-width="0.8"/>
  <line x1="858" y1="150" x2="861" y2="150" stroke="#ccc" stroke-width="0.8"/>

  <!-- Distribution labels -->
  <text x="899" y="88"  font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#999">&#x3BC;</text>
  <text x="899" y="51"  font-family="'Courier New',Courier,monospace" font-size="7"   fill="#bbb">+&#x3C3;</text>
  <text x="899" y="121" font-family="'Courier New',Courier,monospace" font-size="7"   fill="#bbb">&#x2212;&#x3C3;</text>
  <text x="899" y="19"  font-family="'Courier New',Courier,monospace" font-size="6.5" fill="#ccc">+2&#x3C3;</text>
  <text x="899" y="157" font-family="'Courier New',Courier,monospace" font-size="6.5" fill="#ccc">&#x2212;2&#x3C3;</text>
  <text x="878" y="13"  font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#bbb" text-anchor="middle">N(0,t)</text>

  <!-- B(t) and time labels -->
  <text x="508" y="14" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#ccc">B(t)</text>
  <text x="510" y="165" font-family="'Courier New',Courier,monospace" font-size="7" fill="#bbb" text-anchor="middle">t=0</text>
  <text x="860" y="165" font-family="'Courier New',Courier,monospace" font-size="7" fill="#bbb" text-anchor="middle">t=T</text>

  <!-- LEFT TEXT -->
  <text x="28" y="78"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="66" fill="#111" letter-spacing="-1">JER&#xD3;NIMO</text>

  <text x="30" y="106"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="27" fill="#aaa">HOYOS BOTERO</text>

  <line x1="30" y1="120" x2="432" y2="120" stroke="#ddd" stroke-width="1"/>

  <text x="32" y="138"
    font-family="Georgia,'Times New Roman',serif"
    font-style="italic" font-size="15" fill="#666">Data Scientist &#xB7; ML Engineer</text>

  <text x="32" y="153"
    font-family="'Courier New',Courier,monospace"
    font-size="9.5" fill="#aaa" letter-spacing="2.5">MEDELL&#xCD;N &#xB7; COLOMBIA</text>

</svg>
