            708,97 719,99 730,97 741,100 752,97 763,100 774,97"/>

  <!-- F — slight downward, ends ≈110 -->
  <polyline stroke="#555" stroke-width="1" stroke-opacity="0.40" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,95 521,98 532,102 543,99 554,103 565,99 576,104 587,100 598,106
            609,102 620,107 631,104 642,109 653,105 664,110 675,106 686,112 697,107
            708,112 719,108 730,113 741,109 752,112 763,110 774,110"/>

  <!-- G — gradual downward, ends ≈132 -->
  <polyline stroke="#555" stroke-width="1" stroke-opacity="0.30" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    points="510,95 521,100 532,106 543,103 554,108 565,114 576,110 587,116 598,112
